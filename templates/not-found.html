<!DOCTYPE html>
<html lang="en" class="cp">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found · Release tracker</title>
    <link rel="stylesheet" href="../css/system.css">
  </head>
  <body>
    <!-- region: skip: the first focusable element, shown only while focused -->
    <a class="cp-skip" href="#main">Skip to content</a>
    <div class="cp-app">
      <!-- region: header -->
      <header class="cp-header">
        <!-- slot: brand: the mark and the app's name, a link home -->
        <a class="cp-wordmark" href="#">
          <span class="cp-mark" aria-hidden="true">R</span>
          <span class="cp-hidden-narrow">Release tracker</span>
        </a>
        <!-- slot: destinations: none is current, since the address matches no screen -->
        <nav class="cp-nav" aria-label="Main">
          <a class="cp-nav-item" href="#">
            <span class="cp-icon" data-cp-icon="layout-dashboard" aria-hidden="true"></span>
            <span class="cp-nav-label">Overview</span>
          </a>
          <a class="cp-nav-item" href="#">
            <span class="cp-icon" data-cp-icon="library" aria-hidden="true"></span>
            <span class="cp-nav-label">Library</span>
          </a>
          <a class="cp-nav-item" href="#">
            <span class="cp-icon" data-cp-icon="radio-tower" aria-hidden="true"></span>
            <span class="cp-nav-label">Releases</span>
          </a>
        </nav>
        <!-- slot: toolbar: the header status and its panel, the theme toggle, the account button and its menu last -->
        <div class="cp-toolbar">
          <!-- slot: header status: the button and its empty panel, which createHeaderStatus fills -->
          <button class="cp-header-status" type="button" data-state="ok" popovertarget="status">
            <span>All good</span>
          </button>
          <div class="cp-popover cp-status-panel" data-variant="panel" popover id="status"></div>
          <button class="cp-button cp-toggle" data-variant="quiet" data-kind="theme" type="button" aria-label="Dark theme" aria-pressed="false">
            <span class="cp-icon" data-cp-icon="sun" aria-hidden="true"></span>
            <span class="cp-icon" data-cp-icon="moon" data-part="on" aria-hidden="true"></span>
          </button>
          <!-- slot: account: the button and its menu: who is signed in, the account's page, Sign out -->
          <button class="cp-button cp-account" data-variant="quiet" type="button" aria-label="CP, account" popovertarget="account" aria-haspopup="menu">
            <span class="cp-avatar" data-size="sm">CP</span>
          </button>
          <div class="cp-popover cp-menu" id="account" popover role="menu" aria-label="Account">
            <div class="cp-menu-label">Signed in as cplieger</div>
            <a role="menuitem" href="#"><span class="cp-icon" data-cp-icon="user" aria-hidden="true"></span>Account and security</a>
            <hr>
            <button role="menuitem" type="button"><span class="cp-icon" data-cp-icon="log-out" aria-hidden="true"></span>Sign out</button>
          </div>
        </div>
      </header>
      <!-- region: main -->
      <main class="cp-main" id="main" tabindex="-1">
        <div class="cp-stack">
          <!-- slot: banner: the header status's urgent part, as on every screen -->
          <div class="cp-stack" data-gap="tight" id="urgent" hidden></div>
          <!-- slot: content: the not-found page: the glyph, the h1, one sentence and the one link home -->
          <section class="cp-empty" data-variant="page" aria-labelledby="not-found-title">
            <span class="cp-icon" data-cp-icon="telescope" aria-hidden="true"></span>
            <h1 id="not-found-title" tabindex="-1">This page does not exist</h1>
            <p>The address may be old, or the item was removed.</p>
            <a class="cp-button" data-variant="primary" href="#">Go to the library</a>
          </section>
        </div>
      </main>
      <!-- region: status: facts about the whole screen -->
      <footer class="cp-status">
        <span>Data as of <time datetime="2026-11-14T14:02">14:02</time></span>
        <!-- slot: about -->
        <span class="cp-meta" data-part="about">
          <span>Version 3.0.0</span>
          <a href="https://github.com/example/release-tracker" rel="external">Source<span class="cp-visually-hidden">, opens GitHub</span></a>
          <a href="https://github.com/example/release-tracker/blob/main/LICENSE" rel="external">Licence<span class="cp-visually-hidden">, opens GitHub</span></a>
        </span>
      </footer>
    </div>
  </body>
</html>
